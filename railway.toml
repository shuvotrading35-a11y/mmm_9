[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[[deploy]]
name = "bot"
startCommand = "alembic upgrade head && python bot.py"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[[deploy]]
name = "worker"
startCommand = "python worker.py"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
